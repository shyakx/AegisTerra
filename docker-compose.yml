services:
  db:
    image: postgis/postgis:16-3.4
    container_name: aegisterra-postgis
    environment:
      POSTGRES_DB: aegisterra
      POSTGRES_USER: aegisterra
      POSTGRES_PASSWORD: aegisterra
    ports:
      - "5432:5432"
    volumes:
      - aegisterra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegisterra -d aegisterra"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aegisterra_pgdata:
