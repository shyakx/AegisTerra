spring:
  application:
    name: aegisterra-platform
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 500
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: AegisTerra Platform
    version: ${aegisterra.version}
    description: Climate and yield intelligence for agricultural risk planning

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

aegisterra:
  version: 1.0.0
  # ADR-010: partner insurance ops APIs off by default (claims, settlements, policies, workflow, lending).
  modules:
    partner-ops: false
  security:
    jwt:
      secret: ${AEGISTERRA_JWT_SECRET:local-only-change-me-aegisterra-jwt-secret-key-32bytes-min}
      issuer: aegisterra
      access-token-minutes: 15
      refresh-token-days: 7
      remember-me-days: 30
    cookie:
      access-name: at
      refresh-name: rt
      secure: false
      same-site: Lax
    lockout:
      max-failed-attempts: 5
      lock-minutes: 30
      login-rate-limit-per-minute: 20
    cors:
      allowed-origins:
        - http://localhost:3000
        - http://127.0.0.1:3000
    bootstrap:
      enabled: false
      admin-username: ${AEGISTERRA_BOOTSTRAP_ADMIN_USERNAME:admin}
      admin-email: ${AEGISTERRA_BOOTSTRAP_ADMIN_EMAIL:admin@aegisterra.local}
      admin-password: ${AEGISTERRA_BOOTSTRAP_ADMIN_PASSWORD:}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"
