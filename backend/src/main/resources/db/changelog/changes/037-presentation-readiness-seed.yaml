databaseChangeLog:
  - changeSet:
      id: 037-backfill-demo-farm-districts
      author: aegisterra
      comment: >
        Presentation readiness — assign administrative districts to RC1 demo farms so AEZ
        derivation and planning views work. Data-only; replace with real farm.district_id later.
      changes:
        - sql:
            sql: |
              UPDATE farms f
              SET district_id = d.id,
                  updated_at = CURRENT_TIMESTAMP
              FROM (VALUES
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee301', 'GASABO'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee302', 'GASABO'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee303', 'MUSANZE'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee304', 'HUYE'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee305', 'NYAGATARE'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee306', 'NYAGATARE'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee307', 'MUSANZE'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee308', 'NYARUGENGE'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee309', 'MUSANZE'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee310', 'HUYE'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee311', 'NYAGATARE'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee312', 'MUSANZE')
              ) AS v(farm_id, district_code)
              JOIN districts d ON d.code = v.district_code AND d.deleted = false
              WHERE f.id = v.farm_id::uuid
                AND f.deleted = false
                AND f.district_id IS NULL;

              -- Mirror farm district onto farmer residence when farmer has no district yet
              UPDATE farmers fr
              SET district_id = sub.district_id,
                  updated_at = CURRENT_TIMESTAMP
              FROM (
                SELECT DISTINCT ON (f.farmer_id) f.farmer_id, f.district_id
                FROM farms f
                WHERE f.deleted = false AND f.district_id IS NOT NULL
                ORDER BY f.farmer_id, f.created_at
              ) AS sub
              WHERE fr.id = sub.farmer_id
                AND fr.deleted = false
                AND fr.district_id IS NULL;

  - changeSet:
      id: 037-stakeholder-planning-permissions
      author: aegisterra
      comment: >
        Every demo stakeholder role can open climate data + climate intelligence + planning.
        Idempotent. Real deployments grant the same permission codes via IAM, not hard-coded UI.
      changes:
        - sql:
            sql: |
              INSERT INTO role_permissions (id, role_id, permission_id, created_at, updated_at, version, status, deleted)
              SELECT gen_random_uuid(), r.role_id, p.id, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              FROM (VALUES
                ('11111111-1111-1111-1111-111111111002'::uuid),
                ('11111111-1111-1111-1111-111111111003'::uuid),
                ('11111111-1111-1111-1111-111111111004'::uuid),
                ('11111111-1111-1111-1111-111111111005'::uuid),
                ('11111111-1111-1111-1111-111111111006'::uuid),
                ('11111111-1111-1111-1111-111111111007'::uuid),
                ('11111111-1111-1111-1111-111111111008'::uuid),
                ('11111111-1111-1111-1111-111111111009'::uuid)
              ) AS r(role_id)
              CROSS JOIN permissions p
              WHERE p.deleted = false
                AND p.code IN ('climate:read', 'climate-intel:read', 'alerts:climate', 'reports:climate-intel')
                AND NOT EXISTS (
                  SELECT 1 FROM role_permissions rp
                  WHERE rp.role_id = r.role_id
                    AND rp.permission_id = p.id
                );

              UPDATE role_permissions rp
              SET deleted = FALSE, status = 'ACTIVE', updated_at = CURRENT_TIMESTAMP
              FROM permissions p
              WHERE rp.permission_id = p.id
                AND rp.deleted = TRUE
                AND p.code IN ('climate:read', 'climate-intel:read', 'alerts:climate', 'reports:climate-intel')
                AND rp.role_id IN (
                  '11111111-1111-1111-1111-111111111002',
                  '11111111-1111-1111-1111-111111111003',
                  '11111111-1111-1111-1111-111111111004',
                  '11111111-1111-1111-1111-111111111005',
                  '11111111-1111-1111-1111-111111111006',
                  '11111111-1111-1111-1111-111111111007',
                  '11111111-1111-1111-1111-111111111008',
                  '11111111-1111-1111-1111-111111111009'
                );
