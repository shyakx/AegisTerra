databaseChangeLog:
  - changeSet:
      id: 016-claims-alter
      author: aegisterra
      changes:
        - addColumn:
            tableName: claims
            columns:
              - column: { name: claim_type_code, type: "varchar(64)" }
              - column: { name: farmer_id, type: uuid }
              - column: { name: farm_id, type: uuid }
              - column: { name: season_id, type: uuid }
              - column: { name: crop_id, type: uuid }
              - column: { name: cause_of_loss, type: "varchar(255)" }
              - column: { name: assessed_amount, type: "numeric(19,4)" }
              - column: { name: approved_amount, type: "numeric(19,4)" }
              - column: { name: coverage_snapshot_json, type: text }
              - column: { name: financial_snapshot_json, type: text }
              - column: { name: workflow_instance_id, type: uuid }
              - column: { name: workflow_definition_code, type: "varchar(64)" }
              - column: { name: fraud_tier, type: "varchar(16)" }
              - column: { name: fraud_score, type: "numeric(10,4)" }
              - column: { name: fraud_flags_json, type: text }
              - column: { name: submitted_at, type: timestamptz }
              - column: { name: closed_at, type: timestamptz }
              - column: { name: reason_code, type: "varchar(64)" }
              - column: { name: correlation_id, type: "varchar(128)" }
        - createIndex:
            indexName: idx_claims_status
            tableName: claims
            columns:
              - column: { name: status }
        - createIndex:
            indexName: idx_claims_farmer
            tableName: claims
            columns:
              - column: { name: farmer_id }
        - createIndex:
            indexName: idx_claims_type
            tableName: claims
            columns:
              - column: { name: claim_type_code }
        - createIndex:
            indexName: idx_claims_workflow_instance
            tableName: claims
            columns:
              - column: { name: workflow_instance_id }

  - changeSet:
      id: 016-claim-types
      author: aegisterra
      changes:
        - createTable:
            tableName: claim_types
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: code, type: "varchar(64)", constraints: { nullable: false } }
              - column: { name: name, type: "varchar(150)", constraints: { nullable: false } }
              - column: { name: description, type: "varchar(2000)" }
              - column: { name: nature, type: "varchar(32)", constraints: { nullable: false } }
              - column: { name: workflow_definition_code, type: "varchar(64)", constraints: { nullable: false } }
              - column: { name: assessment_profile_json, type: text }
              - column: { name: requires_geo, type: boolean, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: created_by, type: uuid }
              - column: { name: updated_by, type: uuid }
              - column: { name: version, type: bigint, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: status, type: "varchar(32)", constraints: { nullable: false } }
              - column: { name: deleted, type: boolean, defaultValueBoolean: false, constraints: { nullable: false } }
        - sql:
            sql: CREATE UNIQUE INDEX uk_claim_types_code_active ON claim_types (code) WHERE deleted = false;

  - changeSet:
      id: 016-claim-type-document-rules
      author: aegisterra
      changes:
        - createTable:
            tableName: claim_type_document_rules
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: claim_type_code, type: "varchar(64)", constraints: { nullable: false } }
              - column: { name: document_type, type: "varchar(64)", constraints: { nullable: false } }
              - column: { name: required, type: boolean, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: min_count, type: int, defaultValueNumeric: 1, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: created_by, type: uuid }
              - column: { name: updated_by, type: uuid }
              - column: { name: version, type: bigint, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: status, type: "varchar(32)", constraints: { nullable: false } }
              - column: { name: deleted, type: boolean, defaultValueBoolean: false, constraints: { nullable: false } }
        - createIndex:
            indexName: idx_claim_type_doc_rules_type
            tableName: claim_type_document_rules
            columns:
              - column: { name: claim_type_code }

  - changeSet:
      id: 016-claim-drafts
      author: aegisterra
      changes:
        - createTable:
            tableName: claim_drafts
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: owner_user_id, type: uuid, constraints: { nullable: false } }
              - column: { name: current_step, type: int, constraints: { nullable: false } }
              - column: { name: payload_json, type: text, constraints: { nullable: false } }
              - column: { name: expires_at, type: timestamptz }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: created_by, type: uuid }
              - column: { name: updated_by, type: uuid }
              - column: { name: version, type: bigint, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: status, type: "varchar(32)", constraints: { nullable: false } }
              - column: { name: deleted, type: boolean, defaultValueBoolean: false, constraints: { nullable: false } }
        - createIndex:
            indexName: idx_claim_drafts_owner
