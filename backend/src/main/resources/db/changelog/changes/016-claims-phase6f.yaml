  - changeSet:
      id: 016-claims-permissions
      author: aegisterra
      changes:
        - sql:
            sql: |
              INSERT INTO permissions (id, code, name, resource, action, description, created_at, updated_at, version, status, deleted)
              SELECT '22222222-2222-2222-2222-222222220019', 'claims:assess', 'Assess claims', 'claims', 'assess', 'Record assessments and inspections', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              WHERE NOT EXISTS (SELECT 1 FROM permissions WHERE code = 'claims:assess' AND deleted = false);
              INSERT INTO permissions (id, code, name, resource, action, description, created_at, updated_at, version, status, deleted)
              SELECT '22222222-2222-2222-2222-222222220020', 'claims:decide', 'Decide claims', 'claims', 'decide', 'Approve or reject claims', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              WHERE NOT EXISTS (SELECT 1 FROM permissions WHERE code = 'claims:decide' AND deleted = false);
              INSERT INTO permissions (id, code, name, resource, action, description, created_at, updated_at, version, status, deleted)
              SELECT '22222222-2222-2222-2222-222222220021', 'claims:admin', 'Admin claims', 'claims', 'admin', 'Claims administration overrides', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              WHERE NOT EXISTS (SELECT 1 FROM permissions WHERE code = 'claims:admin' AND deleted = false);
              INSERT INTO role_permissions (id, role_id, permission_id, created_at, updated_at, version, status, deleted)
              SELECT gen_random_uuid(), '11111111-1111-1111-1111-111111111001', p.id, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              FROM permissions p
              WHERE p.code IN ('claims:read', 'claims:write', 'claims:assess', 'claims:decide', 'claims:admin') AND p.deleted = false
                AND NOT EXISTS (
                  SELECT 1 FROM role_permissions rp
                  WHERE rp.role_id = '11111111-1111-1111-1111-111111111001' AND rp.permission_id = p.id AND rp.deleted = false
                );
              INSERT INTO role_permissions (id, role_id, permission_id, created_at, updated_at, version, status, deleted)
              SELECT gen_random_uuid(), '11111111-1111-1111-1111-111111111003', p.id, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              FROM permissions p
              WHERE p.code IN ('claims:read', 'claims:write', 'claims:assess', 'claims:decide') AND p.deleted = false
                AND NOT EXISTS (
                  SELECT 1 FROM role_permissions rp
                  WHERE rp.role_id = '11111111-1111-1111-1111-111111111003' AND rp.permission_id = p.id AND rp.deleted = false
                );
              INSERT INTO role_permissions (id, role_id, permission_id, created_at, updated_at, version, status, deleted)
              SELECT gen_random_uuid(), '11111111-1111-1111-1111-111111111008', p.id, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              FROM permissions p
              WHERE p.code = 'claims:read' AND p.deleted = false
                AND NOT EXISTS (
                  SELECT 1 FROM role_permissions rp
                  WHERE rp.role_id = '11111111-1111-1111-1111-111111111008' AND rp.permission_id = p.id AND rp.deleted = false
                );

  - changeSet:
      id: 016-claim-types-seed
      author: aegisterra
      changes:
        - sql:
            sql: |
              INSERT INTO claim_types (id, code, name, description, nature, workflow_definition_code, assessment_profile_json, requires_geo, created_at, updated_at, version, status, deleted)
              SELECT v.id::uuid, v.code, v.name, v.description, v.nature, v.wf, v.profile, v.geo, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              FROM (VALUES
                ('bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbb001', 'WEATHER_INDEX', 'Weather Index', 'Parametric weather index claim', 'PARAMETRIC', 'CLAIM_FAST_TRACK', '["WEATHER_VERIFICATION","DOCUMENT_REVIEW"]', FALSE),
                ('bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbb002', 'YIELD_LOSS', 'Yield Loss', 'Crop yield indemnity claim', 'INDEMNITY', 'CLAIM_STANDARD', '["PHOTO_EVIDENCE","SATELLITE_VERIFICATION","FIELD_INSPECTION"]', TRUE),
                ('bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbb003', 'FLOOD', 'Flood', 'Flood damage claim', 'INDEMNITY', 'CLAIM_STANDARD', '["PHOTO_EVIDENCE","SATELLITE_VERIFICATION","WEATHER_VERIFICATION","FIELD_INSPECTION"]', TRUE),
                ('bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbb004', 'DROUGHT', 'Drought', 'Drought loss claim', 'HYBRID', 'CLAIM_STANDARD', '["WEATHER_VERIFICATION","SATELLITE_VERIFICATION","PHOTO_EVIDENCE"]', TRUE),
                ('bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbb005', 'PEST_DISEASE', 'Pest and Disease', 'Pest or disease loss', 'INDEMNITY', 'CLAIM_STANDARD', '["PHOTO_EVIDENCE","FIELD_INSPECTION","DOCUMENT_REVIEW"]', TRUE),
                ('bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbb006', 'LIVESTOCK', 'Livestock', 'Livestock loss claim', 'INDEMNITY', 'CLAIM_STANDARD', '["PHOTO_EVIDENCE","DOCUMENT_REVIEW","FIELD_INSPECTION"]', TRUE),
                ('bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbb007', 'MANUAL', 'Manual', 'Operator-defined peril', 'INDEMNITY', 'CLAIM_STANDARD', '["DOCUMENT_REVIEW","PHOTO_EVIDENCE","MANUAL_OVERRIDE"]', FALSE),
                ('bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbb008', 'GOVERNMENT_DISASTER', 'Government Disaster', 'Declared disaster claim', 'SPECIAL', 'CLAIM_STANDARD', '["DOCUMENT_REVIEW","WEATHER_VERIFICATION","SATELLITE_VERIFICATION"]', FALSE)
              ) AS v(id, code, name, description, nature, wf, profile, geo)
              WHERE NOT EXISTS (SELECT 1 FROM claim_types ct WHERE ct.code = v.code AND ct.deleted = false);

              INSERT INTO claim_type_document_rules (id, claim_type_code, document_type, required, min_count, created_at, updated_at, version, status, deleted)
              SELECT gen_random_uuid(), v.code, v.doc, TRUE, v.min_count, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              FROM (VALUES
                ('WEATHER_INDEX', 'CLAIM_FORM', 1),
                ('YIELD_LOSS', 'CLAIM_FORM', 1),
                ('YIELD_LOSS', 'PHOTO', 2),
                ('FLOOD', 'CLAIM_FORM', 1),
                ('FLOOD', 'PHOTO', 2),
                ('DROUGHT', 'CLAIM_FORM', 1),
                ('DROUGHT', 'PHOTO', 1),
                ('PEST_DISEASE', 'CLAIM_FORM', 1),
                ('PEST_DISEASE', 'PHOTO', 2),
                ('LIVESTOCK', 'CLAIM_FORM', 1),
                ('LIVESTOCK', 'PHOTO', 1),
                ('MANUAL', 'CLAIM_FORM', 1),
                ('GOVERNMENT_DISASTER', 'CLAIM_FORM', 1),
                ('GOVERNMENT_DISASTER', 'THIRD_PARTY', 1)
              ) AS v(code, doc, min_count)
              WHERE NOT EXISTS (
                SELECT 1 FROM claim_type_document_rules r
                WHERE r.claim_type_code = v.code AND r.document_type = v.doc AND r.deleted = false
              );

  - changeSet:
      id: 016-claim-workflow-seed
      author: aegisterra
      changes:
        - sql:
            sql: |
              INSERT INTO workflow_definitions (id, code, name, description, published_version_id, created_at, updated_at, version, status, deleted)
              SELECT 'cccccccc-cccc-cccc-cccc-ccccccccc001', 'CLAIM_STANDARD', 'Standard claim adjudication', 'Sequential claim path with optional inspection skip', NULL, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              WHERE NOT EXISTS (SELECT 1 FROM workflow_definitions WHERE code = 'CLAIM_STANDARD' AND deleted = false);
              INSERT INTO workflow_definitions (id, code, name, description, published_version_id, created_at, updated_at, version, status, deleted)
              SELECT 'cccccccc-cccc-cccc-cccc-ccccccccc002', 'CLAIM_FAST_TRACK', 'Fast-track claim adjudication', 'Validation then decision without inspection', NULL, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              WHERE NOT EXISTS (SELECT 1 FROM workflow_definitions WHERE code = 'CLAIM_FAST_TRACK' AND deleted = false);

              INSERT INTO workflow_definition_versions (id, definition_id, version_no, graph_json, published_at, created_at, updated_at, version, status, deleted)
              SELECT 'cccccccc-cccc-cccc-cccc-ccccccccc011', 'cccccccc-cccc-cccc-cccc-ccccccccc001', 1, '{"initialStep":"VALIDATION","terminalSteps":["DONE_APPROVED","DONE_REJECTED","DONE_RETURNED"],"steps":[{"code":"VALIDATION","name":"Validation","task":{"taskType":"VERIFICATION","title":"Validate claim intake","assignees":[{"strategy":"ROLE","value":"SYSTEM_ADMIN"}],"allowedDecisions":["APPROVE","REJECT","RETURN"]}},{"code":"INSPECTION","name":"Inspection","task":{"taskType":"INSPECTION","title":"Inspect loss site","assignees":[{"strategy":"ROLE","value":"SYSTEM_ADMIN"}],"allowedDecisions":["APPROVE","SKIP","RETURN"]}},{"code":"ASSESSMENT","name":"Assessment","task":{"taskType":"VERIFICATION","title":"Assess indemnity","assignees":[{"strategy":"ROLE","value":"SYSTEM_ADMIN"}],"allowedDecisions":["APPROVE","RETURN"]}},{"code":"DECISION","name":"Decision","task":{"taskType":"APPROVAL","title":"Adjudicate claim","assignees":[{"strategy":"ROLE","value":"SYSTEM_ADMIN"}],"allowedDecisions":["APPROVE","REJECT","REQUEST_INFORMATION"]}},{"code":"DONE_APPROVED","name":"Approved"},{"code":"DONE_REJECTED","name":"Rejected"},{"code":"DONE_RETURNED","name":"Returned for info"}],"transitions":[{"from":"VALIDATION","to":"INSPECTION","action":"APPROVE"},{"from":"VALIDATION","to":"DONE_REJECTED","action":"REJECT"},{"from":"VALIDATION","to":"DONE_RETURNED","action":"RETURN"},{"from":"INSPECTION","to":"ASSESSMENT","action":"APPROVE"},{"from":"INSPECTION","to":"ASSESSMENT","action":"SKIP"},{"from":"INSPECTION","to":"DONE_RETURNED","action":"RETURN"},{"from":"ASSESSMENT","to":"DECISION","action":"APPROVE"},{"from":"ASSESSMENT","to":"DONE_RETURNED","action":"RETURN"},{"from":"DECISION","to":"DONE_APPROVED","action":"APPROVE"},{"from":"DECISION","to":"DONE_REJECTED","action":"REJECT"},{"from":"DECISION","to":"DONE_RETURNED","action":"REQUEST_INFORMATION"}]}', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'PUBLISHED', FALSE
              WHERE NOT EXISTS (SELECT 1 FROM workflow_definition_versions WHERE id = 'cccccccc-cccc-cccc-cccc-ccccccccc011');
              INSERT INTO workflow_definition_versions (id, definition_id, version_no, graph_json, published_at, created_at, updated_at, version, status, deleted)
