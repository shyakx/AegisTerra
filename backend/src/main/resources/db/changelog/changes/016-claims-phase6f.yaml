  - changeSet:
      id: 016-claim-evidence
      author: aegisterra
      changes:
        - createTable:
            tableName: claim_evidence
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: claim_id, type: uuid, constraints: { nullable: false } }
              - column: { name: document_type, type: "varchar(64)", constraints: { nullable: false } }
              - column: { name: title, type: "varchar(255)", constraints: { nullable: false } }
              - column: { name: document_id, type: uuid }
              - column: { name: storage_uri, type: "varchar(1000)" }
              - column: { name: content_sha256, type: "varchar(128)" }
              - column: { name: latitude, type: "numeric(10,7)" }
              - column: { name: longitude, type: "numeric(10,7)" }
              - column: { name: captured_at, type: timestamptz }
              - column: { name: source, type: "varchar(32)" }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: created_by, type: uuid }
              - column: { name: updated_by, type: uuid }
              - column: { name: version, type: bigint, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: status, type: "varchar(32)", constraints: { nullable: false } }
              - column: { name: deleted, type: boolean, defaultValueBoolean: false, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            constraintName: fk_claim_evidence_claim
            baseTableName: claim_evidence
            baseColumnNames: claim_id
            referencedTableName: claims
            referencedColumnNames: id
        - createIndex:
            indexName: idx_claim_evidence_claim
            tableName: claim_evidence
            columns:
              - column: { name: claim_id }

  - changeSet:
      id: 016-claim-assessments-extend
      author: aegisterra
      changes:
        - addColumn:
            tableName: claim_assessments
            columns:
              - column: { name: inspection_id, type: uuid }
              - column: { name: methods_json, type: text, defaultValue: '[]', constraints: { nullable: false } }
              - column: { name: findings_json, type: text }
              - column: { name: recommended_amount, type: "numeric(19,4)", defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: currency, type: "varchar(3)", defaultValue: 'RWF', constraints: { nullable: false } }
              - column: { name: confidence, type: "numeric(5,2)" }
              - column: { name: fraud_hints_json, type: text }
              - column: { name: assessor_id, type: uuid }
              - column: { name: accepted, type: boolean, defaultValueBoolean: false, constraints: { nullable: false } }
        - sql:
            sql: >
              UPDATE claim_assessments
              SET recommended_amount = COALESCE(assessed_amount, 0),
                  assessor_id = COALESCE(assessor_id, assessor_user_id)
              WHERE deleted = false;

