databaseChangeLog:
  - changeSet:
      id: 035-crop-seasons-yield
      author: aegisterra
      comment: ADR-010 yield learning spine — recorded harvest yield on crop_seasons (t/ha)
      changes:
        - addColumn:
            tableName: crop_seasons
            columns:
              - column:
                  name: yield_t_ha
                  type: numeric(19,4)
                  remarks: Harvested yield in tonnes per hectare; null until recorded

  - changeSet:
      id: 035-seed-historical-seasons
      author: aegisterra
      comment: Season A rows 2016–2024 for multi-year yield outlook (idempotent)
      changes:
        - sql:
            sql: |
              INSERT INTO seasons (id, code, name, start_date, end_date, created_at, updated_at, version, status, deleted)
              SELECT gen_random_uuid(), v.code, v.name, v.start_date::date, v.end_date::date, NOW(), NOW(), 0, 'CLOSED', false
              FROM (VALUES
                ('2016A', 'Season A 2016', '2015-09-01', '2016-02-29'),
                ('2017A', 'Season A 2017', '2016-09-01', '2017-02-28'),
                ('2018A', 'Season A 2018', '2017-09-01', '2018-02-28'),
                ('2019A', 'Season A 2019', '2018-09-01', '2019-02-28'),
                ('2020A', 'Season A 2020', '2019-09-01', '2020-02-29'),
                ('2021A', 'Season A 2021', '2020-09-01', '2021-02-28'),
                ('2022A', 'Season A 2022', '2021-09-01', '2022-02-28'),
                ('2023A', 'Season A 2023', '2022-09-01', '2023-02-28'),
                ('2024A', 'Season A 2024', '2023-09-01', '2024-02-29')
              ) AS v(code, name, start_date, end_date)
              WHERE NOT EXISTS (SELECT 1 FROM seasons s WHERE s.code = v.code AND s.deleted = false);

  - changeSet:
      id: 035-seed-demo-yield-history
      author: aegisterra
      comment: Multi-year MAIZE/BEANS/POTATO yields on RC1 demo farms for planning outlook
      changes:
        - sql:
            sql: |
              INSERT INTO crop_seasons (
                id, farm_id, plot_id, crop_id, season_id, planted_area_ha, yield_t_ha,
                created_at, updated_at, version, status, deleted
              )
              SELECT gen_random_uuid(),
                     f.id,
                     NULL,
                     c.id,
                     s.id,
                     f.farm_size_ha,
                     v.yield_t_ha::numeric,
                     NOW(), NOW(), 0, 'HARVESTED', false
              FROM (VALUES
                -- farm, crop_code, season_code, yield_t_ha
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee301', 'MAIZE', '2016A', 3.40),
