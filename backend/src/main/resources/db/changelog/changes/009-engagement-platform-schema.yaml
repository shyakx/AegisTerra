  - changeSet:
      id: 009-configurations
      author: aegisterra
      changes:
        - createTable:
            tableName: configurations
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: config_key
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: value_json
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(500)
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: uuid
              - column:
                  name: updated_by
                  type: uuid
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - sql:
            sql: CREATE UNIQUE INDEX uk_configurations_key_active ON configurations (config_key) WHERE deleted = false;
