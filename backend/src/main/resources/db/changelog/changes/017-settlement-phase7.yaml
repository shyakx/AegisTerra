databaseChangeLog:
  - changeSet:
      id: 017-settlements
      author: aegisterra
      changes:
        - createTable:
            tableName: settlements
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: settlement_number, type: "varchar(64)", constraints: { nullable: false } }
              - column: { name: source_module, type: "varchar(64)", constraints: { nullable: false } }
              - column: { name: source_record_id, type: uuid, constraints: { nullable: false } }
              - column: { name: source_reference, type: "varchar(128)" }
              - column: { name: amount, type: "numeric(19,4)", constraints: { nullable: false } }
              - column: { name: currency, type: "varchar(3)", constraints: { nullable: false } }
              - column: { name: exchange_rate, type: "numeric(19,8)", defaultValueNumeric: 1, constraints: { nullable: false } }
              - column: { name: payment_method, type: "varchar(64)", constraints: { nullable: false } }
              - column: { name: provider_code, type: "varchar(64)", constraints: { nullable: false } }
              - column: { name: provider_reference, type: "varchar(255)" }
              - column: { name: beneficiary_name, type: "varchar(255)" }
              - column: { name: beneficiary_account, type: "varchar(255)" }
              - column: { name: financial_snapshot_json, type: text, constraints: { nullable: false } }
              - column: { name: workflow_instance_id, type: uuid }
              - column: { name: workflow_definition_code, type: "varchar(64)" }
              - column: { name: correlation_id, type: "varchar(128)" }
              - column: { name: reason_code, type: "varchar(64)" }
              - column: { name: failure_reason, type: "varchar(2000)" }
              - column: { name: submitted_at, type: timestamptz }
              - column: { name: completed_at, type: timestamptz }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: created_by, type: uuid }
              - column: { name: updated_by, type: uuid }
              - column: { name: version, type: bigint, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: status, type: "varchar(32)", constraints: { nullable: false } }
              - column: { name: deleted, type: boolean, defaultValueBoolean: false, constraints: { nullable: false } }
        - sql:
            sql: CREATE UNIQUE INDEX uk_settlements_number_active ON settlements (settlement_number) WHERE deleted = false;
        - createIndex:
            indexName: idx_settlements_status
            tableName: settlements
            columns:
              - column: { name: status }
        - createIndex:
            indexName: idx_settlements_source
            tableName: settlements
            columns:
              - column: { name: source_module }
              - column: { name: source_record_id }
        - createIndex:
            indexName: idx_settlements_workflow
            tableName: settlements
            columns:
              - column: { name: workflow_instance_id }
        - sql:
            sql: >
              CREATE UNIQUE INDEX uk_settlements_source_active
              ON settlements (source_module, source_record_id)
              WHERE deleted = false AND status NOT IN ('CANCELLED','FAILED','REJECTED','CLOSED','REVERSED');

  - changeSet:
      id: 017-settlement-status-history
      author: aegisterra
      changes:
        - createTable:
            tableName: settlement_status_history
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: settlement_id, type: uuid, constraints: { nullable: false } }
              - column: { name: from_status, type: "varchar(32)" }
              - column: { name: to_status, type: "varchar(32)", constraints: { nullable: false } }
              - column: { name: reason, type: "varchar(2000)" }
              - column: { name: actor_id, type: uuid }
              - column: { name: occurred_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: created_by, type: uuid }
              - column: { name: updated_by, type: uuid }
              - column: { name: version, type: bigint, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: status, type: "varchar(32)", constraints: { nullable: false } }
              - column: { name: deleted, type: boolean, defaultValueBoolean: false, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            constraintName: fk_settlement_status_history_settlement
            baseTableName: settlement_status_history
            baseColumnNames: settlement_id
            referencedTableName: settlements
            referencedColumnNames: id
        - createIndex:
            indexName: idx_settlement_status_history_settlement
            tableName: settlement_status_history
            columns:
              - column: { name: settlement_id }
              - column: { name: occurred_at }

