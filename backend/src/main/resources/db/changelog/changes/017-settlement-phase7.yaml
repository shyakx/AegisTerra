  - changeSet:
      id: 017-settlement-workflow-seed
      author: aegisterra
      changes:
        - sql:
            sql: |
              INSERT INTO workflow_definitions (id, code, name, description, published_version_id, created_at, updated_at, version, status, deleted)
              SELECT 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee001', 'SETTLEMENT_STANDARD', 'Standard settlement disbursement', 'Finance review, approval, disburse, confirm', NULL, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              WHERE NOT EXISTS (SELECT 1 FROM workflow_definitions WHERE code = 'SETTLEMENT_STANDARD' AND deleted = false);

              INSERT INTO workflow_definition_versions (id, definition_id, version_no, graph_json, published_at, created_at, updated_at, version, status, deleted)
              SELECT 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee011', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee001', 1,
              '{"initialStep":"FINANCE_REVIEW","terminalSteps":["DONE_COMPLETED","DONE_REJECTED","DONE_FAILED","DONE_CANCELLED"],"steps":[{"code":"FINANCE_REVIEW","name":"Finance Review","task":{"taskType":"VERIFICATION","title":"Review settlement request","assignees":[{"strategy":"ROLE","value":"SYSTEM_ADMIN"}],"allowedDecisions":["APPROVE","REJECT","RETURN"]}},{"code":"APPROVAL","name":"Settlement Approval","task":{"taskType":"APPROVAL","title":"Approve settlement for payment","assignees":[{"strategy":"ROLE","value":"SYSTEM_ADMIN"}],"allowedDecisions":["APPROVE","REJECT"]}},{"code":"DISBURSE","name":"Disburse Payment","task":{"taskType":"FINANCE","title":"Execute payment provider","assignees":[{"strategy":"ROLE","value":"SYSTEM_ADMIN"}],"allowedDecisions":["APPROVE","REJECT"]}},{"code":"CONFIRM","name":"Confirm Payment","task":{"taskType":"FINANCE","title":"Confirm payment received","assignees":[{"strategy":"ROLE","value":"SYSTEM_ADMIN"}],"allowedDecisions":["APPROVE","REJECT"]}},{"code":"DONE_COMPLETED","name":"Completed"},{"code":"DONE_REJECTED","name":"Rejected"},{"code":"DONE_FAILED","name":"Failed"},{"code":"DONE_CANCELLED","name":"Cancelled"}],"transitions":[{"from":"FINANCE_REVIEW","to":"APPROVAL","action":"APPROVE"},{"from":"FINANCE_REVIEW","to":"DONE_REJECTED","action":"REJECT"},{"from":"FINANCE_REVIEW","to":"DONE_CANCELLED","action":"RETURN"},{"from":"APPROVAL","to":"DISBURSE","action":"APPROVE"},{"from":"APPROVAL","to":"DONE_REJECTED","action":"REJECT"},{"from":"DISBURSE","to":"CONFIRM","action":"APPROVE"},{"from":"DISBURSE","to":"DONE_FAILED","action":"REJECT"},{"from":"CONFIRM","to":"DONE_COMPLETED","action":"APPROVE"},{"from":"CONFIRM","to":"DONE_FAILED","action":"REJECT"}]}',
              CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'PUBLISHED', FALSE
              WHERE NOT EXISTS (SELECT 1 FROM workflow_definition_versions WHERE id = 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee011');

