databaseChangeLog:
  - changeSet:
      id: 011-insurance-products
      author: aegisterra
      changes:
        - createTable:
            tableName: insurance_products
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: code
                  type: varchar(64)
                  constraints: { nullable: false }
              - column:
                  name: name
                  type: varchar(255)
                  constraints: { nullable: false }
              - column:
                  name: description
                  type: varchar(2000)
              - column:
                  name: pricing_strategy_code
                  type: varchar(64)
                  constraints: { nullable: false }
              - column:
                  name: eligibility_json
                  type: text
              - column:
                  name: config_json
                  type: text
              - column:
                  name: created_at
                  type: timestamptz
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints: { nullable: false }
              - column:
                  name: created_by
                  type: uuid
              - column:
                  name: updated_by
                  type: uuid
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
              - column:
                  name: status
                  type: varchar(32)
                  constraints: { nullable: false }
              - column:
                  name: deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints: { nullable: false }
        - sql:
            sql: CREATE UNIQUE INDEX uk_insurance_products_code_active ON insurance_products (code) WHERE deleted = false;

