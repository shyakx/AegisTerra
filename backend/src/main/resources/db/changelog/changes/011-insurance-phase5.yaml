  - changeSet:
      id: 011-document-templates-config
      author: aegisterra
      changes:
        - sql:
            sql: |
              INSERT INTO configurations (id, config_key, category, value_json, description, created_at, updated_at, version, status, deleted)
              SELECT gen_random_uuid(), 'insurance.doc.template.POLICY_CERTIFICATE', 'insurance',
                '{"templateCode":"POLICY_CERTIFICATE_V1","locale":"en","body":"POLICY CERTIFICATE\nPolicy: {{policyNumber}}\nFarmer: {{farmerId}}\nFarm: {{farmId}}\nCoverage: {{coverageAmount}} {{currency}}\nPremium: {{premiumAmount}} {{currency}}\nPeriod: {{startDate}} to {{endDate}}\nQR: {{qrPayload}}\nHash: {{contentSha256}}"}',
                'Policy certificate text template', NOW(), NOW(), 0, 'ACTIVE', false
              WHERE NOT EXISTS (SELECT 1 FROM configurations WHERE config_key = 'insurance.doc.template.POLICY_CERTIFICATE' AND deleted = false);
              INSERT INTO configurations (id, config_key, category, value_json, description, created_at, updated_at, version, status, deleted)
              SELECT gen_random_uuid(), 'insurance.doc.template.TERMS_AND_CONDITIONS', 'insurance',
                '{"templateCode":"TERMS_V1","locale":"en","body":"TERMS AND CONDITIONS\nProduct: {{productCode}}\nPackage: {{packageCode}}\nExclusions and waiting periods apply as per coverage snapshot.\n{{coverageSnapshot}}"}',
                'T&C template', NOW(), NOW(), 0, 'ACTIVE', false
              WHERE NOT EXISTS (SELECT 1 FROM configurations WHERE config_key = 'insurance.doc.template.TERMS_AND_CONDITIONS' AND deleted = false);
              INSERT INTO configurations (id, config_key, category, value_json, description, created_at, updated_at, version, status, deleted)
              SELECT gen_random_uuid(), 'insurance.doc.template.COVERAGE_SUMMARY', 'insurance',
                '{"templateCode":"COVERAGE_SUMMARY_V1","locale":"en","body":"COVERAGE SUMMARY\nPolicy: {{policyNumber}}\nSum Insured: {{coverageAmount}} {{currency}}\nSnapshot:\n{{coverageSnapshot}}"}',
                'Coverage summary template', NOW(), NOW(), 0, 'ACTIVE', false
              WHERE NOT EXISTS (SELECT 1 FROM configurations WHERE config_key = 'insurance.doc.template.COVERAGE_SUMMARY' AND deleted = false);
              INSERT INTO configurations (id, config_key, category, value_json, description, created_at, updated_at, version, status, deleted)
              SELECT gen_random_uuid(), 'insurance.premium.quote_ttl_days', 'insurance', '7', 'Premium quote TTL days', NOW(), NOW(), 0, 'ACTIVE', false
              WHERE NOT EXISTS (SELECT 1 FROM configurations WHERE config_key = 'insurance.premium.quote_ttl_days' AND deleted = false);

  - changeSet:
      id: 011-seed-product-catalog
      author: aegisterra
      changes:
        - sql:
            sql: |
              INSERT INTO insurance_products (id, code, name, description, pricing_strategy_code, eligibility_json, config_json, created_at, updated_at, version, status, deleted)
              SELECT 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaa001', 'CROP_MULTI_PERIL', 'Crop Multi-Peril', 'National crop multi-peril product',
                'AREA_MULTIPLIER', '{"requireActiveBoundary":true,"beneficiariesRequired":false}',
                '{"currency":"RWF","baseRatePerHa":25000}', NOW(), NOW(), 0, 'ACTIVE', false
              WHERE NOT EXISTS (SELECT 1 FROM insurance_products WHERE code = 'CROP_MULTI_PERIL' AND deleted = false);

              INSERT INTO policy_types (id, code, name, description, coverage_rules_json, product_id, created_at, updated_at, version, status, deleted)
              SELECT 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaa002', 'MPCI_STANDARD', 'MPCI Standard', 'Standard multi-peril crop insurance',
                '{"perils":["DROUGHT","EXCESS_RAIN","HAIL"]}', 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaa001', NOW(), NOW(), 0, 'ACTIVE', false
              WHERE NOT EXISTS (SELECT 1 FROM policy_types WHERE code = 'MPCI_STANDARD' AND deleted = false);

              INSERT INTO coverage_packages (id, product_id, policy_type_id, code, name, coverage_level_pct, max_sum_insured, config_json, created_at, updated_at, version, status, deleted)
              SELECT 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaa003', 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaa001', 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaa002',
                'PKG_80', '80% Coverage Package', 80.0000, 50000000.0000, '{"sumInsuredPerHa":600000}', NOW(), NOW(), 0, 'ACTIVE', false
              WHERE NOT EXISTS (SELECT 1 FROM coverage_packages WHERE code = 'PKG_80' AND deleted = false);

              INSERT INTO coverage_limits (id, coverage_package_id, peril_code, limit_amount, currency, created_at, updated_at, version, status, deleted)
              SELECT gen_random_uuid(), 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaa003', 'DROUGHT', 50000000.0000, 'RWF', NOW(), NOW(), 0, 'ACTIVE', false
              WHERE NOT EXISTS (SELECT 1 FROM coverage_limits WHERE coverage_package_id = 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaa003' AND peril_code = 'DROUGHT' AND deleted = false);

              INSERT INTO policy_exclusions (id, coverage_package_id, code, description, created_at, updated_at, version, status, deleted)
              SELECT gen_random_uuid(), 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaa003', 'WAR', 'Loss of war and civil unrest', NOW(), NOW(), 0, 'ACTIVE', false
              WHERE NOT EXISTS (SELECT 1 FROM policy_exclusions WHERE coverage_package_id = 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaa003' AND code = 'WAR' AND deleted = false);

              INSERT INTO waiting_periods (id, coverage_package_id, code, days, description, created_at, updated_at, version, status, deleted)
              SELECT gen_random_uuid(), 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaa003', 'ONSET', 14, 'Waiting period from policy start', NOW(), NOW(), 0, 'ACTIVE', false
              WHERE NOT EXISTS (SELECT 1 FROM waiting_periods WHERE coverage_package_id = 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaa003' AND code = 'ONSET' AND deleted = false);

              INSERT INTO premium_pricing_rules (id, rule_code, product_id, factor_code, priority, value_json, description, created_at, updated_at, version, status, deleted)
              SELECT gen_random_uuid(), v.rule_code, 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaa001', v.factor_code, v.priority, v.value_json, v.description, NOW(), NOW(), 0, 'ACTIVE', false
              FROM (VALUES
                ('CMP_BASE', 'INSURANCE_PRODUCT', 10, '{"baseRatePerHa":25000}', 'Base product rate per hectare'),
                ('CMP_CROP', 'CROP_TYPE', 20, '{"defaultMultiplier":1.0,"byCropCode":{"MAIZE":1.1,"BEANS":1.0,"RICE":1.2,"POTATO":1.15,"CASSAVA":0.95}}', 'Crop type multipliers'),
                ('CMP_AREA', 'FARM_AREA', 30, '{"mode":"PER_HA"}', 'Scale by farm area'),
                ('CMP_RISK', 'RISK_ZONE', 40, '{"defaultMultiplier":1.0,"byZone":{"LOW":0.9,"MEDIUM":1.0,"HIGH":1.25}}', 'Risk zone multipliers'),
                ('CMP_WEATHER', 'HISTORICAL_WEATHER', 50, '{"defaultMultiplier":1.0}', 'Historical weather loading'),
                ('CMP_COV', 'COVERAGE_LEVEL', 60, '{"mode":"PCT_OF_PACKAGE"}', 'Coverage level scaling'),
                ('CMP_SUB', 'GOVERNMENT_SUBSIDY', 70, '{"rate":0.40}', '40% government subsidy'),
                ('CMP_DISC', 'DISCOUNT_RULES', 80, '{"maxRate":0.10,"defaultRate":0.0}', 'Discount cap'),
                ('CMP_PARTNER', 'PARTNER_AGREEMENTS', 90, '{"defaultMultiplier":1.0}', 'Partner agreement multiplier'),
                ('CMP_TAX', 'TAXES', 100, '{"rate":0.18}', 'VAT 18%')
              ) AS v(rule_code, factor_code, priority, value_json, description)
              WHERE NOT EXISTS (SELECT 1 FROM premium_pricing_rules r WHERE r.rule_code = v.rule_code AND r.deleted = false);

  - changeSet:
      id: 011-policies-approve-permission
      author: aegisterra
      changes:
        - sql:
            sql: |
              INSERT INTO permissions (id, code, name, resource, action, description, created_at, updated_at, version, status, deleted)
              SELECT '22222222-2222-2222-2222-222222220030', 'policies:approve', 'Approve policies', 'policies', 'approve', 'Approve underwriting decisions', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              WHERE NOT EXISTS (SELECT 1 FROM permissions WHERE code = 'policies:approve' AND deleted = false);
              INSERT INTO role_permissions (id, role_id, permission_id, created_at, updated_at, version, status, deleted)
              SELECT gen_random_uuid(), '11111111-1111-1111-1111-111111111001', p.id, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              FROM permissions p
              WHERE p.code = 'policies:approve' AND p.deleted = false
                AND NOT EXISTS (
                  SELECT 1 FROM role_permissions rp
                  WHERE rp.role_id = '11111111-1111-1111-1111-111111111001' AND rp.permission_id = p.id AND rp.deleted = false
                );
