                  defaultValueNumeric: 0
                  constraints: { nullable: false }
              - column:
                  name: status
                  type: varchar(32)
                  constraints: { nullable: false }
              - column:
                  name: deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints: { nullable: false }
        - addForeignKeyConstraint:
            constraintName: fk_farmers_household
            baseTableName: farmers
            baseColumnNames: household_id
            referencedTableName: households
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_farmers_user
            baseTableName: farmers
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_farmers_aggregator
            baseTableName: farmers
            baseColumnNames: aggregator_id
            referencedTableName: aggregators
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_farmers_partner
            baseTableName: farmers
            baseColumnNames: partner_id
            referencedTableName: partners
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_farmers_district
            baseTableName: farmers
            baseColumnNames: district_id
            referencedTableName: districts
            referencedColumnNames: id
        - createIndex:
            indexName: idx_farmers_status
            tableName: farmers
            columns: [{ name: status }]
        - sql:
            sql: CREATE UNIQUE INDEX uk_farmers_national_id_active ON farmers (national_id) WHERE deleted = false;

