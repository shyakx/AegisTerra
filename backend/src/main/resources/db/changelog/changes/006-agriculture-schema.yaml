databaseChangeLog:
  - changeSet:
      id: 006-households
      author: aegisterra
      changes:
        - createTable:
            tableName: households
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: code
                  type: varchar(64)
                  constraints: { nullable: false }
              - column:
                  name: head_name
                  type: varchar(255)
              - column:
                  name: created_at
                  type: timestamptz
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints: { nullable: false }
              - column:
                  name: created_by
                  type: uuid
              - column:
                  name: updated_by
                  type: uuid
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
              - column:
                  name: status
                  type: varchar(32)
                  constraints: { nullable: false }
              - column:
                  name: deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints: { nullable: false }
        - sql:
            sql: CREATE UNIQUE INDEX uk_households_code_active ON households (code) WHERE deleted = false;

