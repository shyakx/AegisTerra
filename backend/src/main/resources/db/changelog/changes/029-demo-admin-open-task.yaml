databaseChangeLog:
  - changeSet:
      id: 029-demo-admin-open-task
      author: aegisterra
      comment: >
        G1 follow-up — keep SYSTEM_ADMIN My Tasks non-empty after 028 reassigned the
        officer/FI open tasks. Adds one OPEN role-pool oversight task on the existing
        ACTIVE claim workflow instance (CLM-RC1-2026-002). Does not widen visibility.
      changes:
        - sql:
            sql: |
              INSERT INTO workflow_tasks (
                id, instance_id, workflow_step_id, step_code, task_type, title, description,
                subject_type, subject_id, assignee_user_id, assignee_role_code, priority, due_at,
                payload_json, outcome, completed_at, completed_by, created_at, updated_at,
                created_by, updated_by, version, status, deleted
              )
              SELECT
                'dddddddd-dddd-dddd-dddd-ddddddddd029'::uuid,
                'cccccccc-cccc-cccc-cccc-ccccccccc102'::uuid,
                NULL,
                'VALIDATION',
                'VERIFICATION',
                'Oversee claim operations queue',
                'System-admin oversight of open claim CLM-RC1-2026-002 validation backlog.',
                'CLAIM',
                'eeeeeeee-eeee-eeee-eeee-eeeeeeeee702'::uuid,
                NULL,
                'SYSTEM_ADMIN',
                50,
                CURRENT_TIMESTAMP + INTERVAL '3 days',
                '{"claimNumber":"CLM-RC1-2026-002","demo":"029-admin-open"}',
                NULL,
                NULL,
                NULL,
                CURRENT_TIMESTAMP,
                CURRENT_TIMESTAMP,
                NULL,
                NULL,
                0,
                'PENDING',
                FALSE
              WHERE EXISTS (
                SELECT 1 FROM workflow_instances wi
                WHERE wi.id = 'cccccccc-cccc-cccc-cccc-ccccccccc102'::uuid
                  AND wi.deleted = false
                  AND wi.status = 'ACTIVE'
              )
              AND NOT EXISTS (
                SELECT 1 FROM workflow_tasks wt
                WHERE wt.id = 'dddddddd-dddd-dddd-dddd-ddddddddd029'::uuid
              );
