              INSERT INTO decision_rules (id, decision_type_code, outcome_code, effect, workflow_action, workflow_definition_code, step_code, task_type, priority, description, created_at, updated_at, version, status, deleted)
              SELECT '33333333-3333-3333-3333-333333332001', 'APPROVE', 'APPROVED', 'COMPLETE_AND_ADVANCE', 'APPROVE', NULL, NULL, NULL, 0, 'Global approve', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
