              SELECT '33333333-3333-3333-3333-333333330006', 'DELEGATE', 'Delegate', 'Reassign the open task to another user', TRUE, TRUE, 60, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
