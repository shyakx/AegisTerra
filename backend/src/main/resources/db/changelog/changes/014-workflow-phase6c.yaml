                  type: uuid
                  constraints: { nullable: false }
              - column:
                  name: decided_by
                  type: uuid
                  constraints: { nullable: false }
              - column:
                  name: decided_at
                  type: timestamptz
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: timestamptz
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints: { nullable: false }
              - column:
                  name: created_by
                  type: uuid
              - column:
                  name: updated_by
                  type: uuid
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
              - column:
                  name: status
                  type: varchar(32)
                  constraints: { nullable: false }
              - column:
                  name: deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints: { nullable: false }
        - addForeignKeyConstraint:
            constraintName: fk_workflow_decisions_task
            baseTableName: workflow_decisions
            baseColumnNames: task_id
            referencedTableName: workflow_tasks
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_workflow_decisions_instance
            baseTableName: workflow_decisions
            baseColumnNames: instance_id
            referencedTableName: workflow_instances
            referencedColumnNames: id
        - createIndex:
            indexName: idx_workflow_decisions_task
            tableName: workflow_decisions
            columns:
              - column: { name: task_id }
              - column: { name: decided_at }
        - createIndex:
            indexName: idx_workflow_decisions_instance
            tableName: workflow_decisions
            columns:
              - column: { name: instance_id }

  - changeSet:
      id: 014-decision-catalog-seed
      author: aegisterra
      changes:
        - sql:
            sql: |
              INSERT INTO decision_types (id, code, name, description, requires_comment, requires_target_user, sort_order, created_at, updated_at, version, status, deleted)
              SELECT '33333333-3333-3333-3333-333333330001', 'APPROVE', 'Approve', 'Approve and advance when a matching transition exists', FALSE, FALSE, 10, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              WHERE NOT EXISTS (SELECT 1 FROM decision_types WHERE code = 'APPROVE' AND deleted = false);
              INSERT INTO decision_types (id, code, name, description, requires_comment, requires_target_user, sort_order, created_at, updated_at, version, status, deleted)
              SELECT '33333333-3333-3333-3333-333333330002', 'REJECT', 'Reject', 'Reject and advance when a matching transition exists', TRUE, FALSE, 20, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              WHERE NOT EXISTS (SELECT 1 FROM decision_types WHERE code = 'REJECT' AND deleted = false);
              INSERT INTO decision_types (id, code, name, description, requires_comment, requires_target_user, sort_order, created_at, updated_at, version, status, deleted)
              SELECT '33333333-3333-3333-3333-333333330003', 'RETURN', 'Return', 'Return to a prior step via workflow action RETURN', TRUE, FALSE, 30, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              WHERE NOT EXISTS (SELECT 1 FROM decision_types WHERE code = 'RETURN' AND deleted = false);
              INSERT INTO decision_types (id, code, name, description, requires_comment, requires_target_user, sort_order, created_at, updated_at, version, status, deleted)
              SELECT '33333333-3333-3333-3333-333333330004', 'REQUEST_INFORMATION', 'Request information', 'Request more information via workflow routing', TRUE, FALSE, 40, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
