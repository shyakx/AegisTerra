  - changeSet:
      id: 014-decision-permissions
      author: aegisterra
      changes:
        - sql:
            sql: |
              INSERT INTO permissions (id, code, name, resource, action, description, created_at, updated_at, version, status, deleted)
              SELECT '22222222-2222-2222-2222-222222220060', 'decisions:read', 'Read decisions', 'decisions', 'read', 'View decision types and history', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              WHERE NOT EXISTS (SELECT 1 FROM permissions WHERE code = 'decisions:read' AND deleted = false);
              INSERT INTO permissions (id, code, name, resource, action, description, created_at, updated_at, version, status, deleted)
              SELECT '22222222-2222-2222-2222-222222220061', 'decisions:act', 'Record decisions', 'decisions', 'act', 'Submit decisions on tasks', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              WHERE NOT EXISTS (SELECT 1 FROM permissions WHERE code = 'decisions:act' AND deleted = false);
              INSERT INTO role_permissions (id, role_id, permission_id, created_at, updated_at, version, status, deleted)
              SELECT gen_random_uuid(), '11111111-1111-1111-1111-111111111001', p.id, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              FROM permissions p
              WHERE p.code IN ('decisions:read', 'decisions:act') AND p.deleted = false
                AND NOT EXISTS (
                  SELECT 1 FROM role_permissions rp
                  WHERE rp.role_id = '11111111-1111-1111-1111-111111111001' AND rp.permission_id = p.id AND rp.deleted = false
                );
