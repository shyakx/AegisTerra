              SELECT '33333333-3333-3333-3333-333333331007', 'SKIPPED', 'Skipped', NULL, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              WHERE NOT EXISTS (SELECT 1 FROM decision_outcomes WHERE code = 'SKIPPED' AND deleted = false);
