databaseChangeLog:
  - changeSet:
      id: 014-decision-types
      author: aegisterra
      changes:
        - createTable:
            tableName: decision_types
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: code
                  type: varchar(64)
                  constraints: { nullable: false }
              - column:
                  name: name
                  type: varchar(255)
                  constraints: { nullable: false }
              - column:
                  name: description
                  type: varchar(2000)
              - column:
                  name: requires_comment
                  type: boolean
                  defaultValueBoolean: false
                  constraints: { nullable: false }
              - column:
                  name: requires_target_user
                  type: boolean
                  defaultValueBoolean: false
                  constraints: { nullable: false }
              - column:
                  name: sort_order
                  type: int
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: timestamptz
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints: { nullable: false }
              - column:
                  name: created_by
                  type: uuid
              - column:
                  name: updated_by
                  type: uuid
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
              - column:
                  name: status
                  type: varchar(32)
                  constraints: { nullable: false }
              - column:
                  name: deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints: { nullable: false }
        - createIndex:
            indexName: idx_decision_types_code
            tableName: decision_types
            columns:
              - column: { name: code }
        - sql:
            sql: |
              CREATE UNIQUE INDEX uq_decision_types_code_active
              ON decision_types (code)
              WHERE deleted = false;

