                  type: varchar(32)
                  constraints: { nullable: false }
              - column:
                  name: deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints: { nullable: false }
        - addForeignKeyConstraint:
            constraintName: fk_workflow_def_versions_definition
            baseTableName: workflow_definition_versions
            baseColumnNames: definition_id
            referencedTableName: workflow_definitions
            referencedColumnNames: id
        - sql:
            sql: CREATE UNIQUE INDEX uk_workflow_def_versions_no_active ON workflow_definition_versions (definition_id, version_no) WHERE deleted = false;
        - addForeignKeyConstraint:
            constraintName: fk_workflow_definitions_published_version
            baseTableName: workflow_definitions
            baseColumnNames: published_version_id
            referencedTableName: workflow_definition_versions
            referencedColumnNames: id

