  - changeSet:
      id: 013-task-permissions
      author: aegisterra
      changes:
        - sql:
            sql: |
              INSERT INTO permissions (id, code, name, resource, action, description, created_at, updated_at, version, status, deleted)
              SELECT '22222222-2222-2222-2222-222222220050', 'tasks:read', 'Read tasks', 'tasks', 'read', 'View task inbox and details', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              WHERE NOT EXISTS (SELECT 1 FROM permissions WHERE code = 'tasks:read' AND deleted = false);
              INSERT INTO permissions (id, code, name, resource, action, description, created_at, updated_at, version, status, deleted)
              SELECT '22222222-2222-2222-2222-222222220051', 'tasks:act', 'Act on tasks', 'tasks', 'act', 'Claim, complete, cancel tasks', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              WHERE NOT EXISTS (SELECT 1 FROM permissions WHERE code = 'tasks:act' AND deleted = false);
              INSERT INTO permissions (id, code, name, resource, action, description, created_at, updated_at, version, status, deleted)
              SELECT '22222222-2222-2222-2222-222222220052', 'tasks:assign', 'Assign tasks', 'tasks', 'assign', 'Assign and reassign tasks', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              WHERE NOT EXISTS (SELECT 1 FROM permissions WHERE code = 'tasks:assign' AND deleted = false);
              INSERT INTO role_permissions (id, role_id, permission_id, created_at, updated_at, version, status, deleted)
              SELECT gen_random_uuid(), '11111111-1111-1111-1111-111111111001', p.id, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              FROM permissions p
              WHERE p.code IN ('tasks:read', 'tasks:act', 'tasks:assign') AND p.deleted = false
                AND NOT EXISTS (
                  SELECT 1 FROM role_permissions rp
                  WHERE rp.role_id = '11111111-1111-1111-1111-111111111001' AND rp.permission_id = p.id AND rp.deleted = false
                );
