databaseChangeLog:
  - changeSet:
      id: 013-workflow-tasks
      author: aegisterra
      changes:
        - createTable:
            tableName: workflow_tasks
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: instance_id
                  type: uuid
                  constraints: { nullable: false }
              - column:
                  name: workflow_step_id
                  type: uuid
              - column:
                  name: step_code
                  type: varchar(64)
                  constraints: { nullable: false }
              - column:
                  name: task_type
                  type: varchar(32)
                  constraints: { nullable: false }
              - column:
                  name: title
                  type: varchar(255)
                  constraints: { nullable: false }
              - column:
                  name: description
                  type: varchar(2000)
              - column:
                  name: subject_type
                  type: varchar(64)
                  constraints: { nullable: false }
              - column:
                  name: subject_id
                  type: uuid
                  constraints: { nullable: false }
              - column:
                  name: assignee_user_id
                  type: uuid
              - column:
                  name: assignee_role_code
                  type: varchar(64)
              - column:
                  name: priority
                  type: int
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
              - column:
                  name: due_at
                  type: timestamptz
              - column:
                  name: payload_json
                  type: text
              - column:
                  name: outcome
                  type: varchar(64)
              - column:
                  name: completed_at
                  type: timestamptz
              - column:
                  name: completed_by
                  type: uuid
              - column:
                  name: created_at
                  type: timestamptz
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints: { nullable: false }
              - column:
                  name: created_by
                  type: uuid
              - column:
                  name: updated_by
                  type: uuid
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
              - column:
                  name: status
                  type: varchar(32)
                  constraints: { nullable: false }
              - column:
                  name: deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints: { nullable: false }
        - addForeignKeyConstraint:
            constraintName: fk_workflow_tasks_instance
            baseTableName: workflow_tasks
            baseColumnNames: instance_id
            referencedTableName: workflow_instances
            referencedColumnNames: id
        - createIndex:
            indexName: idx_workflow_tasks_assignee_status
            tableName: workflow_tasks
            columns:
              - column: { name: assignee_user_id }
              - column: { name: status }
        - createIndex:
            indexName: idx_workflow_tasks_role_status
            tableName: workflow_tasks
            columns:
              - column: { name: assignee_role_code }
              - column: { name: status }
        - createIndex:
            indexName: idx_workflow_tasks_subject
            tableName: workflow_tasks
            columns:
              - column: { name: subject_type }
              - column: { name: subject_id }
        - createIndex:
            indexName: idx_workflow_tasks_instance
            tableName: workflow_tasks
            columns:
              - column: { name: instance_id }

