  - changeSet:
      id: 020-rc1-demo-policies-claims-settlements
      author: aegisterra
      changes:
        - sql:
            sql: |
              INSERT INTO insurance_policies (
                id, policy_number, farmer_id, farm_id, policy_type_id, product_id, coverage_package_id,
                coverage_amount, premium_amount, currency, start_date, end_date, issued_at,
                created_at, updated_at, version, status, deleted
              )
              SELECT v.id::uuid, v.pnum, v.farmer::uuid, v.farm::uuid,
                     'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaa002'::uuid,
                     'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaa001'::uuid,
                     'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaa003'::uuid,
                     v.coverage, v.premium, 'RWF', CURRENT_DATE - 60, CURRENT_DATE + 120,
                     CASE WHEN v.status = 'ACTIVE' THEN CURRENT_TIMESTAMP - INTERVAL '45 days' ELSE NULL END,
                     CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, v.status, FALSE
              FROM (VALUES
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee601', 'POL-RC1-2026-001', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee201', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee301', 1440000.0000, 72000.0000, 'ACTIVE'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee602', 'POL-RC1-2026-002', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee202', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee303', 1080000.0000, 54000.0000, 'ACTIVE'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee603', 'POL-RC1-2026-003', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee203', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee304', 1920000.0000, 96000.0000, 'ACTIVE'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee604', 'POL-RC1-2026-004', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee204', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee305', 1200000.0000, 60000.0000, 'DRAFT'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee605', 'POL-RC1-2026-005', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee205', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee306', 1560000.0000, 78000.0000, 'ACTIVE'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee606', 'POL-RC1-2026-006', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee206', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee307', 900000.0000, 45000.0000, 'ACTIVE')
              ) AS v(id, pnum, farmer, farm, coverage, premium, status)
              WHERE NOT EXISTS (SELECT 1 FROM insurance_policies p WHERE p.policy_number = v.pnum AND p.deleted = false);

              INSERT INTO claims (
                id, claim_number, policy_id, claimed_amount, currency, incident_date, description,
                claim_type_code, farmer_id, farm_id, cause_of_loss, assessed_amount, approved_amount,
                submitted_at, created_at, updated_at, version, status, deleted
              )
              SELECT v.id::uuid, v.cnum, v.policy::uuid, v.claimed, 'RWF', CURRENT_DATE - v.days_ago, v.descr,
                     v.ctype, v.farmer::uuid, v.farm::uuid, v.cause, v.assessed, v.approved,
                     CURRENT_TIMESTAMP - (v.days_ago || ' days')::interval,
                     CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, v.status, FALSE
              FROM (VALUES
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee701', 'CLM-RC1-2026-001', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee601', 450000.0000, 12, 'Drought stress on maize tasseling', 'DROUGHT', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee201', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee301', 'Drought', 420000.0000, 400000.0000, 'APPROVED'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee702', 'CLM-RC1-2026-002', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee602', 280000.0000, 8, 'Excess rainfall lodging potatoes', 'FLOOD', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee202', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee303', 'Flood', 250000.0000, NULL, 'SUBMITTED'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee703', 'CLM-RC1-2026-003', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee603', 520000.0000, 20, 'Rice field inundation after storm', 'FLOOD', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee203', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee304', 'Flood', 500000.0000, 480000.0000, 'PAYMENT_PENDING'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee704', 'CLM-RC1-2026-004', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee605', 150000.0000, 5, 'Pest damage draft assessment', 'PEST_DISEASE', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee205', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee306', 'Pest', NULL, NULL, 'DRAFT')
              ) AS v(id, cnum, policy, claimed, days_ago, descr, ctype, farmer, farm, cause, assessed, approved, status)
              WHERE NOT EXISTS (SELECT 1 FROM claims c WHERE c.claim_number = v.cnum AND c.deleted = false);

              INSERT INTO settlements (
                id, settlement_number, source_module, source_record_id, source_reference, amount, currency, exchange_rate,
                payment_method, provider_code, beneficiary_name, beneficiary_account, financial_snapshot_json,
                submitted_at, completed_at, created_at, updated_at, version, status, deleted
              )
              SELECT v.id::uuid, v.snum, 'CLAIMS', v.claim::uuid, v.cnum, v.amount, 'RWF', 1,
                     'BANK_TRANSFER', 'MANUAL', v.ben, v.acct,
                     '{"currency":"RWF","source":"RC1_DEMO_SEED","approvedAmount":' || v.amount || '}',
                     CURRENT_TIMESTAMP - INTERVAL '10 days',
                     CASE WHEN v.status = 'COMPLETED' THEN CURRENT_TIMESTAMP - INTERVAL '3 days' ELSE NULL END,
                     CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, v.status, FALSE
              FROM (VALUES
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee801', 'SET-RC1-2026-001', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee701', 'CLM-RC1-2026-001', 400000.0000, 'Jean Niyonzima', 'RW-BANK-1001', 'COMPLETED'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee802', 'SET-RC1-2026-002', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee703', 'CLM-RC1-2026-003', 480000.0000, 'Emmanuel Habimana', 'RW-BANK-1003', 'PENDING')
              ) AS v(id, snum, claim, cnum, amount, ben, acct, status)
              WHERE NOT EXISTS (SELECT 1 FROM settlements s WHERE s.settlement_number = v.snum AND s.deleted = false);

  - changeSet:
      id: 020-rc1-demo-climate-intel
      author: aegisterra
      changes:
        - sql:
            sql: |
              INSERT INTO risk_scores (
                id, farm_id, score, confidence, model_version, calculated_at, grade,
                window_start, window_end, components_json, rule_set_code, rule_version,
                subject_type, district_code, created_at, updated_at, version, status, deleted
              )
              SELECT v.id::uuid, v.farm::uuid, v.score, 0.8500, 'CLIMATE_RISK_V1', CURRENT_TIMESTAMP,
                     v.grade, CURRENT_TIMESTAMP - INTERVAL '30 days', CURRENT_TIMESTAMP,
                     '{"drought":0.4,"flood":0.2,"rainfall":0.3,"vegetation":0.1}',
                     'CLIMATE_RISK_V1', '1.0.0', 'FARM', v.district,
                     CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              FROM (VALUES
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeeea01', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee301', 62.500000, 'HIGH', 'KIGALI'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeeea02', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee303', 38.000000, 'MODERATE', 'MUSANZE'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeeea03', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee304', 78.250000, 'EXTREME', 'HUYE'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeeea04', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee305', 22.000000, 'LOW', 'NYAGATARE'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeeea05', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee306', 55.000000, 'HIGH', 'NYAGATARE'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeeea06', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee307', 41.500000, 'MODERATE', 'MUSANZE'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeeea07', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee308', 18.750000, 'LOW', 'KIGALI'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeeea08', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee309', 48.000000, 'MODERATE', 'MUSANZE')
              ) AS v(id, farm, score, grade, district)
              WHERE NOT EXISTS (SELECT 1 FROM risk_scores r WHERE r.id = v.id::uuid);

              INSERT INTO climate_alerts (
                id, alert_number, alert_type, severity, scope_type, scope_id, farm_id, district_code,
                title, message, valid_from, valid_to, rule_set_code, rule_version,
                created_at, updated_at, version, status, deleted
              )
              SELECT v.id::uuid, v.anum, v.atype, v.sev, 'FARM', v.farm, v.farm::uuid, v.district,
                     v.title, v.msg, CURRENT_TIMESTAMP - INTERVAL '2 days', CURRENT_TIMESTAMP + INTERVAL '14 days',
                     'CLIMATE_RISK_V1', '1.0.0', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'OPEN', FALSE
              FROM (VALUES
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee901', 'ALT-RC1-2026-001', 'DROUGHT', 'CRITICAL', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee301', 'KIGALI', 'Critical drought watch — Kigali maize', 'Soil moisture and rainfall deficits exceed drought thresholds for farm FARM-RC1-001.'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee902', 'ALT-RC1-2026-002', 'FLOOD', 'WARNING', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee304', 'HUYE', 'Flood warning — Huye rice', 'Accumulated rainfall in the last 72 hours exceeds flood watch thresholds.'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee903', 'ALT-RC1-2026-003', 'RAINFALL_EXTREME', 'WATCH', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee303', 'MUSANZE', 'Rainfall anomaly — Musanze', 'Rolling rainfall totals deviate from seasonal normals.'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee904', 'ALT-RC1-2026-004', 'VEGETATION_STRESS', 'INFO', 'eeeeeeee-eeee-eeee-eeee-eeeeeeeee306', 'NYAGATARE', 'Vegetation stress watch', 'Vegetation stress indicator elevated for eastern dryland crops.')
              ) AS v(id, anum, atype, sev, farm, district, title, msg)
              WHERE NOT EXISTS (SELECT 1 FROM climate_alerts a WHERE a.alert_number = v.anum AND a.deleted = false);

              INSERT INTO district_risk_snapshots (
                id, district_code, score, grade, confidence, farm_count, open_alert_count, components_json,
                window_start, window_end, rule_set_code, rule_version, calculated_at,
                created_at, updated_at, version, status, deleted
              )
              SELECT v.id::uuid, v.code, v.score, v.grade, 0.8000, v.farms, v.alerts,
                     '{"source":"RC1_DEMO_SEED"}',
                     CURRENT_TIMESTAMP - INTERVAL '30 days', CURRENT_TIMESTAMP,
                     'CLIMATE_RISK_V1', '1.0.0', CURRENT_TIMESTAMP,
                     CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              FROM (VALUES
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeeeb01', 'KIGALI', 40.500000, 'MODERATE', 3, 1),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeeeb02', 'MUSANZE', 42.500000, 'MODERATE', 3, 1),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeeeb03', 'HUYE', 78.250000, 'EXTREME', 2, 1),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeeeb04', 'NYAGATARE', 38.500000, 'MODERATE', 3, 1)
              ) AS v(id, code, score, grade, farms, alerts)
              WHERE NOT EXISTS (SELECT 1 FROM district_risk_snapshots d WHERE d.id = v.id::uuid);

  - changeSet:
      id: 020-rc1-demo-notifications
      author: aegisterra
      comment: Unread demo notifications (user_id attached at runtime by Rc1DemoNotificationBinder when admin exists)
      changes:
        - sql:
            sql: |
              INSERT INTO notifications (id, user_id, channel, title, body, sent_at, read_at, created_at, updated_at, version, status, deleted)
              SELECT v.id::uuid, NULL, 'IN_APP', v.title, v.body, CURRENT_TIMESTAMP, NULL,
                     CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'SENT', FALSE
              FROM (VALUES
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeeec01', 'Critical drought alert opened', 'Climate Intelligence opened alert ALT-RC1-2026-001 for farm FARM-RC1-001.'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeeec02', 'Settlement pending review', 'Settlement SET-RC1-2026-002 requires finance review before payment execution.'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeeec03', 'Claim submitted', 'Claim CLM-RC1-2026-002 was submitted and awaits validation.')
              ) AS v(id, title, body)
              WHERE NOT EXISTS (SELECT 1 FROM notifications n WHERE n.id = v.id::uuid);