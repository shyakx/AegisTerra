databaseChangeLog:
  - changeSet:
      id: 020-rc1-demo-stations
      author: aegisterra
      comment: Additional weather stations for RC1 national demo map
      changes:
        - sql:
            sql: |
              INSERT INTO weather_stations (id, code, name, geom, elevation_m, provider_code, external_station_id, district_code, created_at, updated_at, version, status, deleted)
              SELECT v.id::uuid, v.code, v.name, ST_SetSRID(ST_MakePoint(v.lon, v.lat), 4326), v.elev, 'MANUAL', v.ext, v.district,
                     CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              FROM (VALUES
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee501', 'DEMO-MUS-01', 'Musanze Highlands Station', 29.6340, -1.4990, 1850.00, 'DEMO-MUS', 'MUSANZE'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee502', 'DEMO-HUE-01', 'Huye Southern Station', 29.7400, -2.5960, 1760.00, 'DEMO-HUE', 'HUYE'),
                ('eeeeeeee-eeee-eeee-eeee-eeeeeeeee503', 'DEMO-NYG-01', 'Nyagatare Eastern Station', 30.3250, -1.3080, 1450.00, 'DEMO-NYG', 'NYAGATARE')
              ) AS v(id, code, name, lon, lat, elev, ext, district)
              WHERE NOT EXISTS (SELECT 1 FROM weather_stations ws WHERE ws.code = v.code AND ws.deleted = false);

  - changeSet:
      id: 020-rc1-demo-observations
      author: aegisterra
      comment: 14-day observation series for demo stations (idempotent by station+day)
      changes:
        - sql:
            sql: |
              INSERT INTO weather_observations (id, station_id, observed_at, temperature_c, rainfall_mm, humidity_pct, wind_speed_ms, source, created_at)
              SELECT gen_random_uuid(), s.id, (CURRENT_DATE - d.day)::timestamp AT TIME ZONE 'UTC' + INTERVAL '12 hours',
                     22.0 + (d.day % 5), CASE WHEN d.day % 4 = 0 THEN 18.5 + d.day ELSE 2.0 + (d.day % 3) END,
                     65.0 + (d.day % 10), 2.5 + (d.day % 3) * 0.4, 'RC1_DEMO_SEED', CURRENT_TIMESTAMP
              FROM weather_stations s
              CROSS JOIN generate_series(0, 13) AS d(day)
              WHERE s.code IN ('DEMO-KGL-01', 'DEMO-MUS-01', 'DEMO-HUE-01', 'DEMO-NYG-01')
                AND s.deleted = false
                AND NOT EXISTS (
                  SELECT 1 FROM weather_observations o
                  WHERE o.station_id = s.id
                    AND o.source = 'RC1_DEMO_SEED'
                    AND date_trunc('day', o.observed_at AT TIME ZONE 'UTC') = (CURRENT_DATE - d.day)
                );

