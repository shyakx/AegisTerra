databaseChangeLog:
  - changeSet:
      id: 032-provinces
      author: aegisterra
      comment: Administrative province above district (ADR-009). geom remains nullable; no fabricated polygons.
      changes:
        - createTable:
            tableName: provinces
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: code
                  type: varchar(32)
                  constraints: { nullable: false }
              - column:
                  name: name
                  type: varchar(150)
                  constraints: { nullable: false }
              - column:
                  name: geom
                  type: geometry(MultiPolygon,4326)
              - column:
                  name: created_at
                  type: timestamptz
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints: { nullable: false }
              - column:
                  name: created_by
                  type: uuid
              - column:
                  name: updated_by
                  type: uuid
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
              - column:
                  name: status
                  type: varchar(32)
                  constraints: { nullable: false }
              - column:
                  name: deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints: { nullable: false }
        - sql:
            sql: CREATE UNIQUE INDEX uk_provinces_code_active ON provinces (code) WHERE deleted = false;
        - sql:
            sql: CREATE INDEX idx_provinces_geom ON provinces USING GIST (geom);

  - changeSet:
      id: 032-agroecological-zones
      author: aegisterra
      comment: Agroecological zone catalog (A–E). Classification layer, not spatial; no geom in Phase 1.
      changes:
        - createTable:
            tableName: agroecological_zones
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: code
                  type: varchar(32)
                  constraints: { nullable: false }
              - column:
                  name: name
                  type: varchar(150)
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: timestamptz
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints: { nullable: false }
              - column:
                  name: created_by
                  type: uuid
              - column:
                  name: updated_by
                  type: uuid
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
              - column:
                  name: status
                  type: varchar(32)
                  constraints: { nullable: false }
              - column:
                  name: deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints: { nullable: false }
        - sql:
            sql: CREATE UNIQUE INDEX uk_agroecological_zones_code_active ON agroecological_zones (code) WHERE deleted = false;

  - changeSet:
      id: 032-agroecological-subzones
      author: aegisterra
      comment: Agroecological sub-zones (A1–E3) belong to exactly one zone.
      changes:
        - createTable:
            tableName: agroecological_subzones
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: zone_id
                  type: uuid
                  constraints: { nullable: false }
              - column:
                  name: code
                  type: varchar(32)
                  constraints: { nullable: false }
              - column:
                  name: name
                  type: varchar(150)
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: timestamptz
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints: { nullable: false }
              - column:
                  name: created_by
                  type: uuid
              - column:
                  name: updated_by
                  type: uuid
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
              - column:
                  name: status
                  type: varchar(32)
                  constraints: { nullable: false }
              - column:
                  name: deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints: { nullable: false }
        - addForeignKeyConstraint:
            constraintName: fk_agroecological_subzones_zone
            baseTableName: agroecological_subzones
            baseColumnNames: zone_id
            referencedTableName: agroecological_zones
            referencedColumnNames: id
        - sql:
            sql: CREATE UNIQUE INDEX uk_agroecological_subzones_code_active ON agroecological_subzones (code) WHERE deleted = false;
        - sql:
            sql: CREATE INDEX idx_agroecological_subzones_zone ON agroecological_subzones (zone_id);

  - changeSet:
      id: 032-districts-province-and-aez
      author: aegisterra
      comment: >
        District belongs to one province (admin geography) and at most one agroecological
        sub-zone (N:1 in the current workbook; nullable so a future zoning scheme can evolve).
      changes:
        - addColumn:
            tableName: districts
            columns:
              - column:
                  name: province_id
                  type: uuid
              - column:
                  name: agroecological_subzone_id
                  type: uuid
        - addForeignKeyConstraint:
            constraintName: fk_districts_province
            baseTableName: districts
            baseColumnNames: province_id
            referencedTableName: provinces
            referencedColumnNames: id
        - addForeignKeyConstraint:
            constraintName: fk_districts_agroecological_subzone
            baseTableName: districts
            baseColumnNames: agroecological_subzone_id
            referencedTableName: agroecological_subzones
            referencedColumnNames: id
        - sql:
            sql: CREATE INDEX idx_districts_province ON districts (province_id);
        - sql:
            sql: CREATE INDEX idx_districts_agroecological_subzone ON districts (agroecological_subzone_id);
