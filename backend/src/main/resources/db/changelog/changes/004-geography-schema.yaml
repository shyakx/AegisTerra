databaseChangeLog:
  - changeSet:
      id: 004-districts
      author: aegisterra
      changes:
        - createTable:
            tableName: districts
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: code
                  type: varchar(32)
                  constraints: { nullable: false }
              - column:
                  name: name
                  type: varchar(150)
                  constraints: { nullable: false }
              - column:
                  name: geom
                  type: geometry(MultiPolygon,4326)
              - column:
                  name: created_at
                  type: timestamptz
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints: { nullable: false }
              - column:
                  name: created_by
                  type: uuid
              - column:
                  name: updated_by
                  type: uuid
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
              - column:
                  name: status
                  type: varchar(32)
                  constraints: { nullable: false }
              - column:
                  name: deleted
                  type: boolean
                  defaultValueBoolean: false
                  constraints: { nullable: false }
        - sql:
            sql: CREATE UNIQUE INDEX uk_districts_code_active ON districts (code) WHERE deleted = false;
        - sql:
            sql: CREATE INDEX idx_districts_geom ON districts USING GIST (geom);

