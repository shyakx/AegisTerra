databaseChangeLog:
  - changeSet:
      id: 026-demo-rbac-role-alignment
      author: aegisterra
      comment: >
        Task 025 — align demo role grants with persona intent using existing permission
        codes only. Soft-revoke unsafe FARMER national reads (no subject isolation yet);
        grant policy write to INSURANCE_OFFICER; notifications:write / support tasks.
      changes:
        - sql:
            sql: |
              -- FARMER: revoke platform-wide registry/insurance reads until subject isolation exists
              UPDATE role_permissions rp
              SET deleted = TRUE, updated_at = CURRENT_TIMESTAMP
              FROM permissions p
              WHERE rp.permission_id = p.id
                AND rp.role_id = '11111111-1111-1111-1111-111111111007'
                AND rp.deleted = FALSE
                AND p.code IN ('farmers:read', 'farms:read', 'policies:read', 'claims:read');

              -- FARMER: keep a usable self-service inbox (own notifications only)
              INSERT INTO role_permissions (id, role_id, permission_id, created_at, updated_at, version, status, deleted)
              SELECT gen_random_uuid(), '11111111-1111-1111-1111-111111111007', p.id, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              FROM permissions p
              WHERE p.deleted = false
                AND p.code IN ('notifications:read', 'notifications:write')
                AND NOT EXISTS (
                  SELECT 1 FROM role_permissions x
                  WHERE x.role_id = '11111111-1111-1111-1111-111111111007'
                    AND x.permission_id = p.id AND x.deleted = false
                );

              -- INSURANCE_OFFICER: policy operational issuance (not approve)
              INSERT INTO role_permissions (id, role_id, permission_id, created_at, updated_at, version, status, deleted)
              SELECT gen_random_uuid(), '11111111-1111-1111-1111-111111111003', p.id, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              FROM permissions p
              WHERE p.deleted = false
                AND p.code = 'policies:write'
                AND NOT EXISTS (
                  SELECT 1 FROM role_permissions x
                  WHERE x.role_id = '11111111-1111-1111-1111-111111111003'
                    AND x.permission_id = p.id AND x.deleted = false
                );

              -- Roles with notification inbox: allow mark-read / preference updates
              INSERT INTO role_permissions (id, role_id, permission_id, created_at, updated_at, version, status, deleted)
              SELECT gen_random_uuid(), r.role_id::uuid, p.id, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              FROM permissions p
              CROSS JOIN (VALUES
                ('11111111-1111-1111-1111-111111111002'),
                ('11111111-1111-1111-1111-111111111003'),
                ('11111111-1111-1111-1111-111111111004'),
                ('11111111-1111-1111-1111-111111111005'),
                ('11111111-1111-1111-1111-111111111006'),
                ('11111111-1111-1111-1111-111111111008'),
                ('11111111-1111-1111-1111-111111111009')
              ) AS r(role_id)
              WHERE p.deleted = false
                AND p.code = 'notifications:write'
                AND NOT EXISTS (
                  SELECT 1 FROM role_permissions x
                  WHERE x.role_id = r.role_id::uuid
                    AND x.permission_id = p.id AND x.deleted = false
                );

              -- SUPPORT: task inbox visibility (read-only)
              INSERT INTO role_permissions (id, role_id, permission_id, created_at, updated_at, version, status, deleted)
              SELECT gen_random_uuid(), '11111111-1111-1111-1111-111111111009', p.id, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              FROM permissions p
              WHERE p.deleted = false
                AND p.code = 'tasks:read'
                AND NOT EXISTS (
                  SELECT 1 FROM role_permissions x
                  WHERE x.role_id = '11111111-1111-1111-1111-111111111009'
                    AND x.permission_id = p.id AND x.deleted = false
                );

              -- AGGREGATOR: ensure notifications:read retained + already getting write above
              INSERT INTO role_permissions (id, role_id, permission_id, created_at, updated_at, version, status, deleted)
              SELECT gen_random_uuid(), '11111111-1111-1111-1111-111111111006', p.id, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, 0, 'ACTIVE', FALSE
              FROM permissions p
              WHERE p.deleted = false
                AND p.code = 'notifications:read'
                AND NOT EXISTS (
                  SELECT 1 FROM role_permissions x
                  WHERE x.role_id = '11111111-1111-1111-1111-111111111006'
                    AND x.permission_id = p.id AND x.deleted = false
                );
