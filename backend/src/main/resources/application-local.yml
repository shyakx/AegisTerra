# Default local profile: PostgreSQL + PostGIS (see AegisTerra/docker-compose.yml)
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/aegisterra
    username: aegisterra
    password: aegisterra
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

aegisterra:
  security:
    bootstrap:
      enabled: true
      admin-password: ${AEGISTERRA_BOOTSTRAP_ADMIN_PASSWORD:Admin@1234!Aa}
      demo-users-enabled: true
      demo-users-password: ${AEGISTERRA_DEMO_USERS_PASSWORD:Demo@1234!Aa}
    cookie:
      secure: false

logging:
  level:
    com.aegisterra: INFO
